# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

name: 👷‍♂️ Build Visual Studio Code Extension

jobs:
  build:
    name: 👷‍♂️ Build
    # Without this block the job runs on the repository default, which was a token with
    # write access to everything. release-drafter needs to create the draft release and
    # read merged pull requests to build its notes, and nothing here needs more.
    permissions:
      contents: write
      pull-requests: read
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 📥 Cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            .vscode-test
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}

      - name: ➕ Dependencies
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          run_install: true

      - name: 🔍 Get Calendar Version
        id: version
        run: |
          git config --global --add safe.directory $PWD
          dir env:
          [string]$version = & .github\Get-CalendarVersion.ps1 -MergeBuild
          "Calculated Version: $version"
          "version=$version" >> $ENV:GITHUB_OUTPUT
          "calendarVersion=$version" >> $ENV:GITHUB_OUTPUT
          "semanticVersion=$version" >> $ENV:GITHUB_OUTPUT

      - name: 👷‍♂️ Build and Package
        run: |
          pnpm package ${{steps.version.outputs.version}}

      - name: ⬆ Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pester Tests VSCode Extension
          path: '*.vsix'

      - name: 📝 Draft Github Release
        if: github.ref == 'refs/heads/main' || github.head_ref == 'ci'
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '${{steps.version.outputs.version}}'
          prerelease: true
          tag: 'v${{steps.version.outputs.version}}'

